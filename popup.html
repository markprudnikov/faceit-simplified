<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FaceIT simplified</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <p class="eyebrow">LESS CLUTTER. MORE PLAY.</p>
      <h1>FaceIT <span>simplified</span></h1>
    </header>
    <label class="setting">
      <span>Simplify matchmaking</span>
      <input id="enabled" type="checkbox" role="switch" disabled>
    </label>
    <p id="status" role="status">Loading your preference…</p>
    <p class="label">Added</p>
    <ul>
      <li>Weekly Elo calendar with history</li>
      <li>Simplified switch next to the anti-cheat icon</li>
    </ul>
    <p class="label section-label">Hidden</p>
    <ul>
      <li>Every banner next to your Elo</li>
      <li>Ladders heading and cards</li>
    </ul>
    <footer>Applies to the matchmaking home page.</footer>
  </body>
</html>
